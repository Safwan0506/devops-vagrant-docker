# Application + observabilité (Prometheus, Grafana, node-exporter)
# Nom de projet fixe : le même, qu'on lance la pile à la main ou via le runner
name: devops-demo

services:
  app:
    # En production (pipeline) : image téléchargée depuis GHCR via APP_IMAGE.
    # En local sans APP_IMAGE : construite à partir de ./app
    image: ${APP_IMAGE:-demo-app:local}
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: demo-app
    restart: unless-stopped
    volumes:
      - app-data:/data   # les tâches survivent aux redéploiements
    ports:
      - "80:3000"   # http://192.168.56.10 (sans numéro de port)

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  app-data:
  prometheus-data:
  grafana-data:
