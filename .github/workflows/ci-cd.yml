name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) CI : tests + vérification que l'image se construit (hébergé par GitHub)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances
        working-directory: app
        run: npm ci
      - name: Tests automatiques
        working-directory: app
        run: npm test
      - name: Construire l'image Docker
        run: docker build -t demo-app:ci ./app

  # 2) CD : déploiement dans la VM Vagrant (runner self-hosted installé dans la VM)
  deploy:
    needs: test
    runs-on: [self-hosted, vagrant]
    steps:
      - uses: actions/checkout@v4
      - name: Déployer avec Docker Compose
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --build --remove-orphans
      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost/health; then echo; exit 0; fi
            sleep 2
          done
          echo "L'application ne répond pas" && docker compose logs app && exit 1
      - name: Nettoyer les anciennes images
        run: docker image prune -f
