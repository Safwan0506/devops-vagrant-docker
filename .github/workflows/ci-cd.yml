name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) CI : tests automatiques (serveur GitHub)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances
        working-directory: app
        run: npm ci
      - name: Tests automatiques
        working-directory: app
        run: npm test

  # 2) Construction de l'image Docker et publication sur GitHub Container Registry (GHCR)
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (en minuscules, exigé par Docker)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
            ${{ steps.nom.outputs.image }}:latest

  # 3) CD : la VM Vagrant télécharge l'image publiée et relance le conteneur
  deploy:
    needs: build
    runs-on: [self-hosted, vagrant]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Se connecter au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Télécharger la nouvelle image et relancer
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          docker compose pull app
          docker compose up -d --remove-orphans
      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost/health; then echo; exit 0; fi
            sleep 2
          done
          echo "L'application ne répond pas" && docker compose logs app && exit 1
      - name: Nettoyer les anciennes images
        run: docker image prune -f
